name: Sync LeetCode History

on:
  workflow_dispatch: # Let's you push the button manually
  schedule:
    - cron: '0 0 * * *' # Auto-runs once every 24 hours

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Run LeetCode Sync Action
        uses: joshcai/leetcode-sync@v1.7.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          
          # Keeps it safely inside your existing LeetCode folder structure
          destination-folder: 'LeetCode'
          
          # Toggles extra stats (like percentiles and question numbers)
          verbose: true
          
          # Custom header for every commit generated by the action
          commit-header: '[LeetCode Sync] Solved'
